# Публикует master в корень GitHub Pages (ветка gh-pages)
name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency: pages-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean-exclude: pr-preview/

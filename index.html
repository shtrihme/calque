<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calque</title>
    <link rel="icon" type='image/png' href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="math.min.js"></script>
    <script src="cm.js"></script>
    <script src="calque-math.js"></script>
    <script src="calque.js"></script>
    <script src="tabs.js"></script>
    <script>
        window.onload = function () {
            CalqueTabs.start({
                editor: document.getElementById('editor'),
                help: document.getElementById('help').textContent,
                toolbar: document.getElementById('toolbar'),
                bar: document.getElementById('tabs')
            });
        };
    </script>
</head>
<body>
    <div class="calque-tabs" id="tabs"></div>
    <div class="calque-editor" id="editor"></div>
    <script type="text/plain" id="help"># Справка Calque
# Каждая строка считается сразу, результат стоит справа.
# Это обычный расчёт: меняйте числа и смотрите, что выйдет.
# Исходный вид справки вернёт меню ⋯ → Справка.

# ВЫРАЖЕНИЯ
2 + 2 * 2
sqrt(3^2 + 4^2)
10 / 4
5!

# ПЕРЕМЕННЫЕ
# Имена можно писать по-русски
цена = 120
количество = 3
цена * количество

# ПРЕДЫДУЩИЙ РЕЗУЛЬТАТ
2 * 2
last + 1

# СВОИ ФУНКЦИИ
квадрат(x) = x^2
квадрат(6)

# ЕДИНИЦЫ
# Русские: г, кг, мг, т, мл, л, мм, см, м, км, с, мин, ч, сут, кал, ккал
1 кг to г
(2 ч + 30 мин) to мин
90 км / (1.5 ч)
2 inch to cm
# Граммы с килокалориями не сложатся, будет ошибка.
# Не называйте переменную как единицу: поле «ккал» спрячет единицу ккал

# ГРУППЫ
# Строка с двоеточием на конце — группа.
# Всё, что ниже с отступом, складывается в её итог, справа — доля каждого значения
Покупки:
  Овощи:
    огурцы = 12000
    укроп = 3000
  Молочное:
    сметана = 18000

# Значения группы доступны через точку, регистр не важен
Покупки.Овощи
покупки.молочное.сметана * 2

# ТАБЛИЦЫ
# Если у подгрупп повторяются имена полей, группа считает итог по каждому полю.
# _имя = формула — итог группы, место в группе не важно.
# Внутри формула считается по каждой строке, но в строках не показывается.
# _имя без формулы в строке — показать там формулу группы.
# __имя = формула — показывать во всех строках.
# имя := значение — не попадает в итог.
# (%) в конце формулы показывает значение как процент
Салат:
  _калории = вес * калорийность
  _рацион = калории / (2000 ккал) * 100 (%)
  огурцы:
    _калории
    вес = 100 г
    калорийность := 15 ккал / (100 г)
  сметана:
    вес = 50 г
    калорийность := 200 ккал / (100 г)

Салат.калории
Салат.огурцы.вес

# ТИПЫ
# @Имя: — тип. Внутри: поле, поле [единица], поле = значение по умолчанию,
# _формула = выражение и ? проверка. @Салат: @Блюдо — тип на основе другого.
# Поля, которых нет в типе, разрешены
@Блюдо:
  вес [г]
  калорийность [ккал/г]
  _энергия = вес * калорийность
  ? энергия < 800 ккал

@Суп: @Блюдо
  объём [мл]
  соль := 0 г

# Имя: @Тип — группа этого типа: значения по умолчанию и формулы берутся из типа,
# а если нет обязательного поля или единица не та, заголовок покажет ошибку
Борщ: @Суп
  вес = 400 г
  объём = 350 мл
  калорийность := 0.5 ккал / г
Борщ.энергия

# Имя: @Тип[] — тип для каждой строки таблицы
Обед: @Блюдо[]
  гречка:
    вес = 200 г
    калорийность := 1.1 ккал / г
  котлета:
    вес = 100 г
    калорийность := 2.5 ккал / г

# ПРОВЕРКИ
# ? условие — ✓ или ✗. Для сравнения с допуском есть ±
ответ = 42.68
? ответ == 42.7 ± 0.1
? ответ > 50

# КОММЕНТАРИИ
# Всё после # — комментарий. Если он стоит в конце строки, результат появится под ней
вес_коробки = 2.5 кг * 4 # четыре коробки

# ФУНКЦИИ КАЛЬКУЛЯТОРА
# Интеграл на отрезке, производная в точке
integral(x^2, x, 0, 3)
ddx(x^3, x, 2)
# Сумма и произведение ряда
Σ(k^2, k, 1, 10)
Π(k, k, 1, 5)
# Корень уравнения, последнее число — с чего начать поиск
solve(x^2 == 2, x, 1)
# Корни многочлена, коэффициенты от старшей степени: x³ − 6x² + 11x − 6
roots(1, -6, 11, -6)
# Распределения: нормальное, биномиальное, Пуассона
normcd(-1, 1)
invnorm(0.975)
binompdf(3, 10, 0.5)
poissonpdf(2, 3)
# Дроби, матрицы, комбинаторика, системы счисления
fraction(1/3) + fraction(1/6)
det([1, 2; 3, 4])
combinations(5, 2)
hex(255)
# Полярные координаты, угол в градусах
pol(1, 1)
rec(2, 30)
# Статистика
mean([2, 4, 9])
std([2, 4, 9])

# РЕДАКТОР
# Нажмите на имя, чтобы увидеть его значение и строку, где оно задано
# Начните набирать имя — появится список подсказок, Tab или Enter подставит
# ▾ слева от группы сворачивает её
# Ошибка подчёркивается волнистой линией на том слове, где она случилась
# Выделите число и нажимайте стрелки вверх и вниз, с Shift — шаг в 10 раз больше
# Ctrl+D — повторить строку
# Ctrl+F — поиск, Ctrl+H — замена
# Ctrl+клик — ещё один курсор
# Tab и Shift+Tab — добавить и убрать отступ
# Shift+Alt+F — отформатировать всё

# ПАНЕЛЬ ВНИЗУ
# ↶ и ↷ — отменить и повторить правку
# −10, −1, +1, +10 — изменить число под курсором
# ⇤ и ⇥ — отступ
# ⧉ — скопировать выделенные строки с итогами, без выделения — весь расчёт
# 🔗 — ссылка на этот расчёт: у получателя он откроется новой вкладкой

# ВКЛАДКИ
# + — новый расчёт, × — закрыть текущий
# Название вкладки — первая строка расчёта
# Всё хранится в этом браузере. Чтобы не потерять, сохраняйте вкладки в файл

# МЕНЮ ⋯
# Номера строк и автоформат — включаются и выключаются
# Отформатировать всё
# Сохранить все вкладки в файл и открыть файл
# Справка — этот расчёт

# https://github.com/shtrihme/calque</script>
    <div id="toolbar"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calque</title>
    <link rel="icon" type='image/png' href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="math.min.js"></script>
    <script src="calque-math.js"></script>
    <script src="calque.js"></script>
    <script>
        window.onload = function () {
            var input = document.getElementById('input');
            var stored = null;
            try { stored = localStorage.getItem('input'); } catch (e) {}

            function start(text) {
                if (text !== null) input.value = text;
                window.calque = new Calque(input, document.getElementById('output'), {
                    toolbar: document.getElementById('toolbar')
                });
                input.focus();
            }

            if (location.hash.length > 3) {
                Calque.decodeText(location.hash).then(function (shared) {
                    history.replaceState(null, '', location.pathname + location.search);
                    if (shared !== null && stored && stored !== shared) {
                        try { localStorage.setItem('input_backup', stored); } catch (e) {}
                    }
                    start(shared !== null ? shared : stored);
                });
            } else {
                start(stored);
            }
        };
    </script>
</head>
<body>
    <div class="interface">
        <div class="output" id="output"></div>
        <textarea class="input" id="input" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"># Calque — калькулятор, который считает на ходу

# Выражения
2 + 2 * 2
sqrt(3^2 + 4^2)
2 inch to cm
cos(45 deg)

# Переменные
a = 25
b = a * 2

# Группы складываются сами
Вкусности:
  Орехи:
    Грецкие = 100
    Арахис = 300
  Конфеты:
    Шоколадные = 100
    Мармеладные = 100

# Обращение через точку. Наберите «вкусности.» — внизу появятся подсказки
Вкусности.Орехи.Арахис * 2
Вкусности.Конфеты / Вкусности

# Функции
pow2(x) = x ^ 2
pow2(6)

# Предыдущий результат
2 * 2
last + 1

# Функции калькулятора
integral(x^2, x, 0, 3)
ddx(x^3, x, 2)
Σ(k^2, k, 1, 10)
solve(x^2 == 2, x, 1)
roots(1, -6, 11, -6)
normcd(-1, 1)
fraction(1/3) + fraction(1/6)

# Клавиши
# Ctrl+D — повторить строку
# Выделить число, стрелки вверх и вниз — менять его, с Shift — шаг ×10
# Tab — принять первую подсказку или добавить отступ, Shift+Tab — убрать отступ
# На телефоне то же самое — кнопками внизу

# https://github.com/shtrihme/calque</textarea>
    </div>
    <div id="toolbar"></div>
</body>
</html>
